[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-fish-tts"
version = "0.1.0"
description = "Discord bot that speaks user-provided text in voice channels via Fish Audio TTS Live."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "websockets>=13",
    "msgpack>=1.1",
    "python-dotenv>=1.0",
    "PyNaCl>=1.5",
    # davey 0.2.0 (2026-11-02) never yields an encryption key with discord.py 2.7.x,
    # so all outgoing audio is silently dropped. Keep <0.2 until discord.py supports it.
    "davey>=0.1.5,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
discord-fish-tts = "discord_fish_tts.bot:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
